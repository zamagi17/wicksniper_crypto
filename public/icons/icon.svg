<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141b28" />
      <stop offset="100%" stop-color="#070a0f" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="6" />

  <!-- Outer Radar Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-dasharray="8 6" opacity="0.8" />

  <!-- Middle Target Ring -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#b388ff" stroke-width="6" filter="url(#glow)" />

  <!-- Inner Core -->
  <circle cx="256" cy="256" r="50" fill="#ff3366" filter="url(#glow)" />
  <circle cx="256" cy="256" r="20" fill="#ffffff" />

  <!-- Crosshairs -->
  <line x1="256" y1="40" x2="256" y2="180" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" />
  <line x1="256" y1="332" x2="256" y2="472" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" />
  <line x1="40" y1="256" x2="180" y2="256" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" />
  <line x1="332" y1="256" x2="472" y2="256" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" />

  <!-- Dynamic Wick Bolt -->
  <path d="M266 170 L240 240 L268 240 L246 310" stroke="#ffb300" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />
</svg>
